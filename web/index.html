<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printer Updates</title>
<!-- pushraker_updates: the confirm page behind the link buttons of the
     Discord update notice (webhook setups), part of diehard-pushraker.
     It talks to this printer's
     Moonraker, like Mainsail and Fluidd do. -->
<style>
:root { --bg:#f6f7f9; --card:#fff; --fg:#1c1f24; --mute:#626a75; --line:#dde1e6;
        --accent:#2f6fd6; --ok:#24743a; --bad:#b02626; --warn:#b56a00; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#15171a; --card:#1e2125; --fg:#e7e9ec; --mute:#9aa3ad; --line:#30343a;
          --accent:#5b93f0; --ok:#4fb26a; --bad:#e06060; --warn:#e0a040; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:20px; margin:0 0 4px; }
.sub { color:var(--mute); margin:0 0 18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:4px 16px; }
.row { display:flex; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
.row:first-child { border-top:0; }
.row .what { flex:1; min-width:0; }
.row .name { font-weight:600; overflow-wrap:anywhere; }
.row .ver { color:var(--mute); font-size:13px; overflow-wrap:anywhere; }
.row .res { font-size:13px; white-space:nowrap; }
.ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
.actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
button { font:inherit; border-radius:8px; padding:10px 16px; cursor:pointer;
         border:1px solid var(--line); background:var(--card); color:var(--fg); }
button.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
button:disabled { opacity:.5; cursor:default; }
#msg { margin-top:14px; color:var(--mute); min-height:1.4em; }
label { display:flex; gap:8px; align-items:center; }
</style>
</head>
<body>
<main>
  <h1 id="title">Printer updates</h1>
  <p class="sub" id="sub">Checking Moonraker…</p>
  <div class="card" id="list"></div>
  <div class="actions">
    <button id="reload">Check again</button>
    <button id="every">Show all updates</button>
  </div>
  <div id="msg"></div>
</main>
<script>
"use strict";
const q = new URLSearchParams(location.search);
// ?name=<entry>: that entry (the Discord card's link button); none: all
const only = q.get("name");
const $ = id => document.getElementById(id);
let items = [];
let running = false;

function order(i) {
  const n = i.name.toLowerCase(), k = (i.kind || "").toLowerCase();
  if (k.endsWith("_os") || k === "os" || n.endsWith(" os")) return 4;
  if (n === "moonraker") return 3;
  if (n === "system") return 2;
  if (n === "klipper") return 1;
  return 0;
}

// Same rules as pushraker_updates.pending()
function pending(vi) {
  const out = [];
  for (const [name, info] of Object.entries(vi || {})) {
    const kind = info.configured_type || "";
    if (name === "system" || kind === "system") {
      if (info.package_count) out.push({name, kind:"system", text:`${info.package_count} package(s)`});
      continue;
    }
    const v = String(info.version || "?"), r = String(info.remote_version || "?");
    const behind = info.commits_behind_count ?? (info.commits_behind || []).length;
    const newer = r !== "?" && r !== "" && r !== v;
    if (!newer && !(behind > 0)) continue;
    let text = newer ? `${v} → ${r}` : v;
    if (behind > 0) text += ` (+${behind} commit${behind === 1 ? "" : "s"})`;
    const why = info.is_valid === false ? "not a valid install" : info.is_dirty ? "has local changes" : "";
    out.push({name, kind, text, why});
  }
  return out.sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name));
}

async function api(path, method = "GET") {
  const r = await fetch(path, {method});
  let body = null;
  try { body = await r.json(); } catch (e) { /* not JSON */ }
  if (!r.ok) {
    const m = body && body.error && body.error.message;
    const err = new Error(m || `HTTP ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return body ? body.result : null;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

const results = {};

function draw() {
  const list = $("list");
  if (!items.length) {
    list.innerHTML = `<div class="row"><div class="what">${only ? `No update for ${esc(only)} right now.` : "Everything is up to date."}</div></div>`;
    return;
  }
  // One entry at a time: no "update all" on purpose
  list.innerHTML = items.map((i, n) => {
    const res = results[i.name] || (i.why ? `<span class="warn">${esc(i.why)}</span>` : "");
    const btn = i.why || results[i.name] ? ""
      : `<button class="go" data-n="${n}" ${running ? "disabled" : ""}>Update</button>`;
    return `<div class="row"><div class="what">
      <div class="name">${esc(i.name)}</div><div class="ver">${esc(i.text)}</div></div>
      <div class="res">${res}</div>${btn}</div>`;
  }).join("");
  for (const b of list.querySelectorAll("button[data-n]")) b.onclick = () => update(items[+b.dataset.n]);
}

async function load() {
  $("msg").textContent = "";
  try {
    const [st, info] = await Promise.all([
      api("/machine/update/status"),
      api("/printer/objects/query?print_stats").catch(() => null)]);
    let all = pending(st.version_info);
    items = only === null ? all : all.filter(i => i.name === only);
    const state = info && info.status && info.status.print_stats && info.status.print_stats.state;
    $("sub").textContent = state === "printing" || state === "paused"
      ? "The printer is printing: Moonraker refuses updates until it's done."
      : only === null ? `${items.length} update(s) available.` : "";
    draw();
  } catch (e) {
    $("sub").textContent = `Moonraker didn't answer: ${e.message}`;
  }
}

async function waitIdle() {
  for (let n = 0; n < 240; n++) {
    await new Promise(r => setTimeout(r, 5000));
    try { const st = await api("/machine/update/status"); if (!st.busy) return st; }
    catch (e) { /* Moonraker restarting */ }
  }
  return null;
}

async function update(i) {
  if (running) return;
  if (!confirm(`Update ${i.name}?` + (order(i) >= 3 ? "\nMoonraker or the printer will restart." : ""))) return;
  running = true;
  results[i.name] = "updating…";
  draw();
  $("msg").textContent = `Updating ${i.name}…`;
  let err = "";
  try {
    await api(`/machine/update/upgrade?name=${encodeURIComponent(i.name)}`, "POST");
  } catch (e) {
    // A proxy timeout or Moonraker's own restart: wait for it, then read the version
    if (e.status && e.status < 500) err = e.message;
    else await waitIdle();
  }
  let st = null;
  try { st = await api("/machine/update/status"); } catch (e) { /* */ }
  const left = st ? pending({[i.name]: st.version_info[i.name] || {}}) : [];
  results[i.name] = err ? `<span class="bad">❌ ${esc(err)}</span>`
    : st && !left.length ? `<span class="ok">✅ done</span>`
    : `<span class="warn">⚠️ check</span>`;
  running = false;
  $("msg").textContent = err ? "The update failed." : "Finished.";
  draw();
}

$("reload").onclick = load;
$("every").hidden = only === null;
$("every").onclick = () => { location.search = ""; };
load();
</script>
</body>
</html>
