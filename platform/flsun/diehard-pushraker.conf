# diehard-pushraker on the FLSUN T1 - Moonraker settings
# platform/flsun/install.sh copies this file to
# ~/printer_data/config/diehard-pushraker.conf once and never overwrites it
# (sync.sh adds sections that later versions bring). [pushraker] itself is
# in moonraker.conf (pushraker's installer); the notification settings are
# in pushraker.conf, set from http://<printer-ip>/notifications/

[update_manager diehard-pushraker]
channel: stable
type: git_repo
primary_branch: main
path: ~/diehard-pushraker
origin: https://github.com/DIEHARDave/diehard-pushraker.git
# Restarting the service after an update runs sync.sh, which wires the new
# version in and restarts Moonraker.
managed_services: diehard-pushraker

[pushraker_cards]
# Discord messages as status cards: status, temperatures, progress bar,
# print time, ETA, layer and file as fields, the printer's name in the
# footer. False: pushraker's own plain embed.
discord_cards: True

[pushraker_updates]
# Software update notices on Discord with buttons that start the updates
# The settings page's System section (Software updates, Edit) sets the
# schedule and turns them on or off; these values are the defaults until
# saved there.
# (moonraker/components/pushraker_updates.py; README "Update notices").
# Checks Moonraker's update manager on this schedule:
check_time: 09:00
#   one or more HH:MM, e.g. 09:00, 21:00
check_days: daily
#   daily, weekdays, weekends, or days: mon, wed, fri
#timezone: America/Denver
#   default: pushraker's time zone setting, else the printer's
notify: changes
#   changes: only when something new is available; always: every check
#ignore: mainsail, fluidd
#   update manager entries to leave out
# Discord bot setups get real buttons; a channel webhook gets link buttons
# to this page (reachable at home or over a VPN):
page_url: http://{host}/pushraker-updates/
# The card's "Open in browser" link (pushraker's web UI address wins when
# set on its page). Fluidd: http://{host}:81/
web_ui_url: http://{host}/
# Optional: a bot of its own for the update notices, for real buttons in
# a server channel (channel ID) or its owner's DMs (dm). Keep the token
# in Moonraker's secrets file.
#bot_token: {secrets.pushraker_updates.bot_token}
#channel: dm
#allowed_users: 123456789012345678
#   who may click besides the bot's owner (Discord user IDs)
#confirm: True
#buttons: True
#other_services: False
#   True: a text notice with the page link to pushraker's other services
#enabled: True
